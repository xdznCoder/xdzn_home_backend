server:
  port: ${PORT:3001}

spring:
  application:
    name: xdzn_home_backend
  datasource:
    url: jdbc:mysql://localhost:3306/xdzn?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never

sa-token:
  is-jwt: true
  jwt-secret-key: ${JWT_SECRET:dev-secret-change-in-production}
  token-name: Authorization
  is-read-head: true
  # 绝对有效期 30 天
  timeout: 2592000
  # 活动有效期 30 天：用户持续活跃时每次请求自动续期（滑动续期），无需 refresh_token
  active-timeout: 2592000
  is-concurrent: true
  is-log: false
  token-prefix: Bearer
  # 说明：Sa-Token 会话存储于 Redis，key 形如 "{token-name}:login:token:*"（即 Authorization:login:*），
  # 与业务缓存（login:fail:* 等）天然隔离，无需额外 dao-prefix

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  join-notify-email: ${JOIN_NOTIFY_EMAIL:}
