server:
  port: ${PORT:3001}

spring:
  application:
    name: xdzn_home_backend
  datasource:
    url: jdbc:mysql://localhost:3306/xdzn?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  sql:
    init:
      mode: never
  servlet:
    multipart:
      # 上传大小限制（单个文件 20MB，请求 40MB）
      max-file-size: 20MB
      max-request-size: 40MB
  # 邮件发送（站外通信：公告推送），配置 SMTP 后启用
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

sa-token:
  is-jwt: true
  jwt-secret-key: ${JWT_SECRET:dev-secret-change-in-production}
  token-name: Authorization
  is-read-head: true
  # 绝对有效期 30 天
  timeout: 2592000
  # 活动有效期 30 天：用户持续活跃时每次请求自动续期（滑动续期），无需 refresh_token
  active-timeout: 2592000
  is-concurrent: true
  is-log: false
  token-prefix: Bearer
  # 说明：Sa-Token 会话存储于 Redis，key 形如 "{token-name}:login:token:*"（即 Authorization:login:*），
  # 与业务缓存（login:fail:* 等）天然隔离，无需额外 dao-prefix

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  join-notify-email: ${JOIN_NOTIFY_EMAIL:}
  # 文件上传存储目录（相对项目根目录）
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 单文件大小上限（字节，默认 20MB）
  max-file-size: ${MAX_FILE_SIZE:20971520}
  # 图床配置（GitHub 图床 + jsDelivr CDN，免费）
  image-hosting:
    # GitHub Personal Access Token（需 repo 权限）
    github-token: ${GITHUB_TOKEN:}
    # 存图仓库（如 xdznCoder/xdzn-images）
    github-repo: ${GITHUB_REPO:xdznCoder/xdzn-images}
    # 仓库内图片目录前缀
    github-path: ${GITHUB_IMG_PATH:images}
    # 仓库分支
    github-branch: ${GITHUB_IMG_BRANCH:main}
  # QQ 机器人（go-cqhttp / OneBot HTTP 接口，站外通信：公告推送群消息）
  qq-bot:
    # 接口地址，留空则跳过 QQ 群发送（仅记录日志）
    url: ${QQ_BOT_URL:}

# 接口文档（Knife4j / SpringDoc）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
knife4j:
  enable: true
  setting:
    language: zh_cn
